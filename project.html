<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Bangun Datar</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen">

    <header class="w-full">
    <nav class="bg-gray-800 max-w-6xl mx-auto px-6 py-8 flex justify-between items-center">

        <h1 class="font-bold text-lg text-2xl text-white">
            My Portofolio
        </h1>

        <div class="flex gap-8 text-gray-400 font-semibold">

            <a href="index.html" class="text-white hover:text-gray-300">
                Home
            </a>

            <a href="about.html" class="hover:text-white">
                About
            </a>

        </div>

    </nav>
</header>

    <div class="max-w-lg mx-auto py-10 px-4">

        <div class="text-center mb-6">

            <h1 class="text-3xl font-bold text-gray-800">
                Kalkulator Bangun Datar
            </h1>

            <p class="text-gray-600 mt-2">
                Menghitung luas dan keliling
            </p>

        </div>

        <div class="bg-white rounded-lg shadow p-6">

            <h2 class="font-semibold text-gray-800 mb-3">
                Pilih Bangun Datar
            </h2>

            <div class="space-y-2 mb-6">

                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="bangun"
                        value="persegi"
                        onclick="ubahForm()"
                    >

                    <span>Persegi</span>
                </label>


                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="bangun"
                        value="persegiPanjang"
                        onclick="ubahForm()"
                    >

                    <span>Persegi Panjang</span>
                </label>


                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="bangun"
                        value="segitiga"
                        onclick="ubahForm()"
                    >

                    <span>Segitiga</span>
                </label>


                <label class="flex items-center gap-2">
                    <input
                        type="radio"
                        name="bangun"
                        value="lingkaran"
                        onclick="ubahForm()"
                    >

                    <span>Lingkaran</span>
                </label>

            </div>

            <div id="input">

                <p class="text-gray-500 text-center">
                    Silakan pilih bangun datar
                </p>

            </div>

            <button
                onclick="hitung()"
                class="w-full bg-gray-800 text-white
                       py-2.5 rounded-lg mt-5
                       hover:bg-gray-700">

                Hitung

            </button>

            <div
                id="hasil"
                class="hidden mt-5 border-t pt-5">

                <h2 class="font-semibold mb-3">
                    Hasil Perhitungan
                </h2>

                <div class="flex justify-between mb-2">

                    <span class="text-gray-600">
                        Luas
                    </span>

                    <span id="luas" class="font-semibold">
                        -
                    </span>

                </div>


                <div class="flex justify-between">

                    <span class="text-gray-600">
                        Keliling
                    </span>

                    <span id="keliling" class="font-semibold">
                        -
                    </span>

                </div>

            </div>

        </div>

    </div>


    <script>

        function ubahForm() {

            let bangun =
                document.querySelector(
                    'input[name="bangun"]:checked'
                ).value;

            let input =
                document.getElementById("input");

            if (bangun == "persegi") {

                input.innerHTML = `

                    <label class="block mb-2">
                        Sisi
                    </label>

                    <input
                        type="number"
                        id="sisi"
                        placeholder="Masukkan sisi"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5
                               focus:outline-none
                               focus:border-gray-500"
                    >

                `;

            }

            else if (bangun == "persegiPanjang") {

                input.innerHTML = `

                    <label class="block mb-2">
                        Panjang
                    </label>

                    <input
                        type="number"
                        id="panjang"
                        placeholder="Masukkan panjang"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5 mb-4"
                    >


                    <label class="block mb-2">
                        Lebar
                    </label>

                    <input
                        type="number"
                        id="lebar"
                        placeholder="Masukkan lebar"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5"
                    >

                `;

            }

            else if (bangun == "segitiga") {

                input.innerHTML = `

                    <label class="block mb-2">
                        Alas
                    </label>

                    <input
                        type="number"
                        id="alas"
                        placeholder="Masukkan alas"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5 mb-4"
                    >


                    <label class="block mb-2">
                        Tinggi
                    </label>

                    <input
                        type="number"
                        id="tinggi"
                        placeholder="Masukkan tinggi"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5"
                    >

                `;

            }

            else if (bangun == "lingkaran") {

                input.innerHTML = `

                    <label class="block mb-2">
                        Jari-jari
                    </label>

                    <input
                        type="number"
                        id="jari"
                        placeholder="Masukkan jari-jari"
                        class="w-full border border-gray-300
                               rounded-lg p-2.5"
                    >

                `;

            }

        }

        function hitung() {

            let bangun =
                document.querySelector(
                    'input[name="bangun"]:checked'
                );

            if (!bangun) {

                alert("Silakan pilih bangun datar!");

                return;

            }


            let luas = 0;
            let keliling = 0;

            if (bangun.value == "persegi") {

                let sisi =
                    Number(
                        document.getElementById("sisi").value
                    );

                luas = sisi * sisi;

                keliling = 4 * sisi;

            }

            else if (bangun.value == "persegiPanjang") {

                let panjang =
                    Number(
                        document.getElementById("panjang").value
                    );

                let lebar =
                    Number(
                        document.getElementById("lebar").value
                    );

                luas = panjang * lebar;

                keliling =
                    2 * (panjang + lebar);

            }

            else if (bangun.value == "segitiga") {

                let alas =
                    Number(
                        document.getElementById("alas").value
                    );

                let tinggi =
                    Number(
                        document.getElementById("tinggi").value
                    );

                luas =
                    0.5 * alas * tinggi;

                keliling = 3 * alas;

            }


            else if (bangun.value == "lingkaran") {

                let jari =
                    Number(
                        document.getElementById("jari").value
                    );

                luas =
                    Math.PI * jari * jari;

                keliling =
                    2 * Math.PI * jari;

            }

            document
                .getElementById("hasil")
                .classList.remove("hidden");


            document
                .getElementById("luas")
                .innerHTML =
                luas.toFixed(2);


            document
                .getElementById("keliling")
                .innerHTML =
                keliling.toFixed(2);

        }

    </script>

</body>

</html>
